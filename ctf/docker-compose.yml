# cyberguard CTF — player stack. Start it, then open the game in your browser:
#   docker compose -f cyberguard-ctf.yml up
#   http://127.0.0.1:8071
#
# Safety: the intentionally-vulnerable target sits on an internal-only network
# with no route anywhere, read-only, no capabilities, synthetic data. The agent
# makes no outbound calls unless you choose to share a session (and SHARE_URL is
# set), and both of its ports are bound to 127.0.0.1, so nothing here is
# reachable from your network.
name: cyberguard-ctf

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 256m
  restart: "no"

services:
  target:
    <<: *hardened
    image: ghcr.io/aaronjadler/cyberguard-target:latest
    environment:
      SESSION_FILE: /ctf-session/session.json
      AGENT_URL: http://agent:8071
    volumes:
      - ctf-session:/ctf-session:ro
    networks: [isolated]

  agent:
    <<: *hardened
    image: ghcr.io/aaronjadler/cyberguard-agent:latest
    environment:
      # Empty = session sharing is off and nothing ever leaves your machine.
      SHARE_URL: ${SHARE_URL-}
      TARGET_URL: http://target:8070
      SESSION_FILE: /ctf-session/session.json
      STATE_DIR: /agent-state
    ports:
      - "127.0.0.1:8070:8070"   # the challenge
      - "127.0.0.1:8071:8071"   # the game UI: open http://127.0.0.1:8071
    volumes:
      - ctf-session:/ctf-session
      - agent-state:/agent-state   # your handle + login token; the target never sees it
    networks: [isolated, egress]   # egress is needed to publish the 127.0.0.1 ports
    depends_on: [target]

networks:
  isolated:
    internal: true   # no route to the internet or your LAN
  egress: {}

volumes:
  ctf-session: {}
  agent-state: {}
